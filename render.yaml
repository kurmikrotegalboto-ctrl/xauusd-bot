# Render Blueprint — Free tier deployment
# https://render.com/docs/blueprint-spec
# Free tier: Web Service (sleeps after 15min inactivity) + Upstash Redis (free 10k cmds/day)

services:
  # ===== Web Service (Next.js app) =====
  - type: web
    name: xauusd-bot
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/xau/paper-trade
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: '1'
      - key: TWELVEDATA_API_KEY
        sync: false  # set manually in dashboard
      - key: REDIS_URL
        fromService:
          type: redis
          name: xauusd-redis
          property: connectionString

  # ===== Redis (Upstash via Render — free tier) =====
  - type: redis
    name: xauusd-redis
    plan: free
    region: singapore
    ipAllowList: []  # allow all (Render requires explicit allowlist, empty = public)
    maxmemoryPolicy: allkeys-lru
